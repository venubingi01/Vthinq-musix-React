<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient with Deep Obsidian & Magenta Atmosphere -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#240f22" />
      <stop offset="55%" stop-color="#140918" />
      <stop offset="85%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#05060a" />
    </radialGradient>

    <!-- Signature Sangeetham Theme Gradient: Hot Pink to Vivid Sunset Coral / Orange -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ff2d75" />
      <stop offset="40%" stop-color="#ee0979" />
      <stop offset="80%" stop-color="#ff5e00" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d75" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#ee0979" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0.9" />
    </linearGradient>

    <!-- Neon Pink Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Floating Sparkle / Note Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Solid Background -->
  <rect width="512" height="512" fill="#060810" />

  <!-- Squircle App Icon Tile with Theme Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Concentric Vinyl / Audio Wave Grooves in Ambient Pink -->
  <g opacity="0.18" stroke="#ff2d75" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="80" />
    <circle cx="256" cy="256" r="110" />
    <circle cx="256" cy="256" r="140" />
    <circle cx="256" cy="256" r="170" />
    <circle cx="256" cy="256" r="200" />
  </g>

  <!-- Equalizer Spectrum Bars in Theme Gradient (Bottom Left) -->
  <g opacity="0.45" fill="url(#glyphGrad)">
    <rect x="74" y="405" width="6" height="22" rx="3" />
    <rect x="85" y="395" width="6" height="32" rx="3" />
    <rect x="96" y="390" width="6" height="37" rx="3" />
    <rect x="107" y="382" width="6" height="45" rx="3" />
    <rect x="118" y="388" width="6" height="39" rx="3" />
    <rect x="129" y="398" width="6" height="29" rx="3" />
    <rect x="140" y="407" width="6" height="20" rx="3" />
    <rect x="151" y="412" width="6" height="15" rx="3" />
  </g>

  <!-- Telugu Letter "స" (Sa) - Sangeetham Symbol with Theme Neon Glow -->
  <g filter="url(#neonGlow)">
    <text
      x="256"
      y="342"
      font-family="'Kohinoor Telugu', 'Telugu Sangam MN', 'Noto Sans Telugu', sans-serif"
      font-size="270"
      font-weight="bold"
      text-anchor="middle"
      fill="url(#glyphGrad)"
    >స</text>
  </g>

  <!-- Floating Musical Note 🎵 near Talakattu with Luminous White-Rose -->
  <g filter="url(#subtleGlow)">
    <text
      x="355"
      y="160"
      font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif"
      font-size="60"
      font-weight="bold"
      fill="#fff0f5"
    >♪</text>
  </g>
</svg>